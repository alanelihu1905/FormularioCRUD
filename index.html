<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema Escolar · Personas (CRUD)</title>
  <link rel="stylesheet" href="assets/scripts/styles.css" />
</head>
<body>
  <header>
    <div class="barra">
      <h1>Listado de Personas</h1>
      <div class="grupo-botones">
        <button id="btnRecargar" class="boton btn-sec">Recargar</button>
        <button id="btnNuevaPersona" class="boton">Nueva persona</button>
      </div>
    </div>
  </header>

  <main>
    <section class="tarjeta contenedor-tabla">
      <table id="tablaPersonas" aria-describedby="ayudaTabla">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Sexo</th>
            <th>Cumpleaños</th>
            <th>Rol</th>
            <th>Calificación</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td class="estado" colspan="7">Cargando datos…</td></tr>
        </tbody>
      </table>
      <p id="ayudaTabla" class="sr-only">Tabla con acciones para editar o borrar cada fila.</p>
    </section>
  </main>

  <!-- Modal -->
  <div id="cortinaModal" class="cortina" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
    <div class="modal">
      <header><div class="barra"><h2 id="tituloModal">Registrar persona</h2></div></header>

      <form id="formularioPersona" novalidate>
        <input type="hidden" id="id_persona" />
        <div class="campo"><label for="nombre">Nombre</label><input id="nombre" required /></div>
        <div class="campo"><label for="apellido">Apellido</label><input id="apellido" required /></div>
        <div class="campo">
          <label for="sexo">Sexo</label>
          <select id="sexo" required>
            <option value="">Selecciona…</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
          </select>
        </div>
        <div class="campo"><label for="fecha">Fecha de nacimiento</label><input id="fecha" type="date" required /></div>
        <div class="campo">
          <label for="id_rol">Rol</label>
          <select id="id_rol" required>
            <option value="">Selecciona…</option>
            <option value="1">Alumno</option>
            <option value="2">Profesor</option>
            <option value="3">Administrativo</option>
            <option value="4">Otro</option>
          </select>
        </div>
        <div class="campo"><label for="calificacion">Calificación (0–10)</label><input id="calificacion" type="number" min="0" max="10" step="0.1" placeholder="Opcional" /></div>
      </form>

      <div class="pie">
        <button id="btnCancelar" class="boton btn-sec" type="button">Cancelar</button>
        <button id="btnGuardar" class="boton" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Capa de carga global -->
  <div id="capaCargando" class="capa-cargando" aria-hidden="true"><div class="spinner" aria-label="Cargando"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/scripts/app.js" defer></script>
</body>
</html>
